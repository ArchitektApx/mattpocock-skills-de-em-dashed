version: 2

updates:
  # Actions are pinned to commit SHAs, which never move on their own. Without
  # this, a pin is frozen forever and an upstream security fix never arrives.
  # Dependabot bumps the SHA and rewrites the trailing version comment, so the
  # pins stay pins and sha_pinning_required stays satisfied.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      # Three distinct actions across three workflows. One PR beats several.
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # package.json / package-lock.json are upstream's (changesets tooling) and are
  # overwritten by every sync. Not this fork's responsibility: no version
  # updates, and ignoring every dependency also silences security-update PRs
  # for this ecosystem. Alerts still show in the Security tab.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
