name: Sync upstream

# Regenerates main from mattpocock/skills:
#   1. start from upstream/main's tree
#   2. overlay the fork-owned paths (.github/workflows, scripts/fork) from our main
#   3. run scripts/fork/apply-fork.mjs (repo metadata, README notice, CLAUDE.md section)
#   4. run scripts/fork/de-em-dash.sh (em dash -> hyphen)
#   5. commit the result as a merge of our main and upstream/main, push
#
# Because the tree is rebuilt from upstream every time there is nothing to
# conflict; the merge commit only exists to keep the upstream history linked.
# GITHUB_TOKEN pushes do not trigger other workflows, which is why the em dash
# replacement runs here as well as in de-em-dash.yml.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writers
  cancel-in-progress: false

env:
  UPSTREAM_REPO: mattpocock/skills
  UPSTREAM_BRANCH: main
  FORK_OWNED_PATHS: .github/workflows scripts/fork

jobs:
  sync:
    name: Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"

      - name: Rebuild main from upstream
        id: rebuild
        run: |
          set -euo pipefail
          MAIN="$(git rev-parse HEAD)"
          UP="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"

          if git merge-base --is-ancestor "$UP" "$MAIN"; then
            echo "Already up to date with upstream ${UP}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Working tree + index = upstream.
          git checkout --quiet --detach "$UP"

          # Fork-owned paths come from our main, wholesale (upstream's copies are dropped).
          for p in $FORK_OWNED_PATHS; do
            git rm -r -q --cached --ignore-unmatch -- "$p"
            rm -rf -- "$p"
          done
          git checkout "$MAIN" -- $FORK_OWNED_PATHS

          node scripts/fork/apply-fork.mjs
          bash scripts/fork/de-em-dash.sh
          git add -A

          TREE="$(git write-tree)"
          SHORT="$(git rev-parse --short "$UP")"
          COMMIT="$(git commit-tree "$TREE" -p "$MAIN" -p "$UP" \
            -m "chore: sync upstream ${UPSTREAM_REPO}@${SHORT}" \
            -m "Regenerated from ${UPSTREAM_REPO} ${UP} with fork overlay applied.")"

          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Push
        if: steps.rebuild.outputs.changed == 'true'
        run: git push origin "${{ steps.rebuild.outputs.commit }}:refs/heads/main"
