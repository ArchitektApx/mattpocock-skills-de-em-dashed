name: Replace em dashes

# Safety net: runs scripts/fork/de-em-dash.sh against main and, if anything
# changed, opens a pull request with the result. verify.yml already fails any
# PR that contains an em dash, so this mostly matters after a manual dispatch
# or if the rules on main change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: de-em-dash
  cancel-in-progress: false

jobs:
  de-em-dash:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Replace em dashes
        run: bash scripts/fork/de-em-dash.sh

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          base: main
          branch: chore/de-em-dash
          delete-branch: true
          title: "chore: replace em dashes with hyphens"
          commit-message: "chore: replace em dashes with hyphens"
          body: "Output of `scripts/fork/de-em-dash.sh` against `main`."
          labels: de-em-dash
          sign-commits: true
